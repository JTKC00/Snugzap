name: SEO foundation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: seo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Production to preview to branch to production output isolation
        run: |
          CONTEXT=production npm run build
          CONTEXT=deploy-preview npm run build
          CONTEXT=branch-deploy npm run build
          CONTEXT=production npm run build
      - name: Production and preview browser acceptance
        run: |
          status=0
          CONTEXT=production npm run build && CONTEXT=production npm run test:browser || status=1
          CONTEXT=deploy-preview npm run build && CONTEXT=deploy-preview npm run test:browser || status=1
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-evidence
          path: artifacts/
          if-no-files-found: ignore
