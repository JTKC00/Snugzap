name: SEO foundation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: seo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - id: unit
        run: npm test
      - name: Production to preview to branch to production output isolation
        run: |
          status=0
          for context in production deploy-preview branch-deploy production; do
            CONTEXT="$context" npm run build || status=1
          done
          exit "$status"
      - name: Production and preview browser acceptance
        if: ${{ !cancelled() && steps.unit.outcome == 'success' }}
        run: |
          status=0
          for context in production deploy-preview; do
            rm -rf dist
            CONTEXT="$context" npm run build || status=1
            # A post-build asset failure must not suppress independent browser evidence.
            # The failure is retained above; there is no continue-on-error or green bypass.
            if test -f dist/index.html; then
              CONTEXT="$context" npm run test:browser || status=1
            else
              status=1
            fi
          done
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-evidence
          path: |
            artifacts/
            dist/snugzap-og.jpg
          if-no-files-found: ignore
